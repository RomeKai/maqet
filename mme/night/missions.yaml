# Maqet night missions (assisted self-build, ADR-022), aligned with mme/milestones.yaml and docs/PLAN.md. Each one moves the NEXT day's work forward.
# The evening before: refine the goal if needed, commit, `mme night prep` (answer the agent), `mme night run --until 07:30`.
# Missions run one after another, each in its own worktree from `main`, so they must NOT share files: scopes below are
# disjoint. Shared files are wired by day the next morning: server/api.py, web/src/i18n/*, package.json, requirements.txt.
# Real spend is ~$0.10 per mission on Spark contributor; budgets are kill caps, not estimates.
# Demo inputs (plans, hand-drawn sketches, site photo + `*.truth.json`) live under `samples/plans/`.
defaults:
  harness: gateway
  base: main
  timeout_min: 120
  link: [web/node_modules]

missions:
  # ---------------------------------------------------------------- done (merged into main)
  - id: intake-cleanup
    status: skip
    template: feature
    budget_usd: 2.0
    goal: |
      Done: server/intake/cleanup.py (merged).
    scope: ["server/intake/cleanup.py", "server/tests/test_intake_cleanup.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_intake_cleanup.py"

  - id: asset-catalog
    status: skip
    template: single
    budget_usd: 1.0
    goal: |
      Done: assets/catalog.json + server/tests/test_catalog.py (merged 2026-10-28, brick yields corrected).
    scope: ["assets/catalog.json", "server/tests/test_catalog.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_catalog.py"

  - id: agent-tools
    status: skip
    template: feature
    budget_usd: 2.5
    goal: |
      Done: server/agent/tools.py, executor.py, stages.py (merged 2026-10-28).
    scope: ["server/agent/tools.py", "server/agent/executor.py", "server/agent/stages.py", "server/tests/test_agent_tools.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_agent_tools.py"

  # ---------------------------------------------------------------- Wed 28 night: 10 missions, disjoint scopes
  # 1. Day 4 (Reform) core: the tool-calling loop over the merged executor
  - id: agent-loop
    status: draft
    template: feature
    budget_usd: 1.5
    goal: |
      Implement server/agent/loop.py, the Reform agent's tool-calling loop (ADR-002, ADR-014): run_turn(scene, history,
      stage, user_text, client, selected=None) -> TurnResult(scene, history, reply, tool_events). It offers the current
      stage's tools (server/agent/stages.py) as function tools, executes every call through server/agent/executor.py's
      execute(), feeds each ToolResult back, and stops after a final text reply or 6 tool rounds (structured "too many
      steps" reply). The system prompt lives in server/agent/prompts/reform_v1.md: Spanish first, answers in the user's
      language, never invents coordinates, always surfaces rule violations and "needs a licensed professional" flags in plain
      words, labels outputs preliminary. Stable prefix (system prompt + tool schemas) first and the user text last, for cache
      hits; a stable prompt_cache_key; tag "reform". The client is injected: production passes mme.client (check its real
      signature with inspect, never call api.meta.ai directly); tests pass a scripted fake client, no network. Tests: a
      single tool call, a multi-step turn, a rule violation surfaced in the reply, a professional flag surfaced, an
      out-of-stage tool refused, the 6-round stop, and selected-wall context passed through. Do not edit server/api.py
      (the route is wired by day).
    context: [AGENTS.md, .claude/skills/reform-agent/SKILL.md, .claude/skills/meta-model-api/SKILL.md, .claude/rules/mme/meta-credits.md, server/agent/executor.py, server/agent/stages.py, server/agent/tools.py]
    scope: ["server/agent/loop.py", "server/agent/prompts/**", "server/tests/test_agent_loop.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_agent_loop.py tests/test_agent_tools.py"

  # 2. P0 differentiator: staged takeoff (catalog is merged now)
  - id: quantities-takeoff
    status: draft
    template: feature
    budget_usd: 1.5
    goal: |
      Implement server/export/takeoff.py, the staged construction takeoff (ADR-021, ADR-024). Deterministic, no model calls,
      no prices. From a Scene (optionally vs a captured base Scene) and the per-material recipes in assets/catalog.json,
      compute quantities by stage in this order: foundations, walls, bond_beams_roof, openings, finishes (bricks per m2 of
      wall net of openings by brick type and thickness, mortar, cement bags, sand and gravel in m3, steel bars for bond
      beams, roofing sheets, doors and windows; floor/wall finish m2 net of openings; metres demolished and built). Apply each
      recipe's waste factor and carry its recipe_source; quantities derived from walls with provenance "estimated" are
      marked estimated. Return a pydantic Takeoff with the active professional-required flags and a "preliminary" label,
      plus to_csv(takeoff). Tests use samples/plans/*.truth.json with hand-computed expected values per stage, and a base vs
      reform case (only new walls count as built, removed ones as demolished). Do not edit server/api.py (wired by day).
    context: [AGENTS.md, docs/DECISIONS.md, .claude/skills/scene-model/SKILL.md, assets/catalog.json, server/scene/models.py, server/scene/rules.py]
    scope: ["server/export/takeoff.py", "server/tests/test_takeoff.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_takeoff.py tests/test_catalog.py"

  # 3. Reform hardening
  - id: reform-ops
    status: draft
    template: feature
    budget_usd: 1.5
    goal: |
      Harden the Reform ops in server/scene/ops.py (add_room, add_wall, remove_wall, add_opening, move_opening): re-polygonize
      and recompute rooms after every op (helper module server/scene/rooms.py), keep surface/furniture assignments where the
      room survives, re-validate furniture (report a conflict, never move it silently), keep undo exact, flag removal of a
      load-bearing wall as professional-required, and run rules.py construction rules on every result. Keep every existing
      op signature used by server/agent/executor.py working. Property tests: 30 random Reform op sequences on the
      samples/plans scenes never crash, never leave a Scene that violates the geometry rules, and undo back to the start
      restores the original Scene exactly.
    context: [AGENTS.md, .claude/skills/scene-model/SKILL.md, .claude/skills/reform-agent/SKILL.md, server/scene/ops.py, server/scene/rules.py, server/agent/executor.py]
    scope: ["server/scene/ops.py", "server/scene/rooms.py", "server/tests/test_reform.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_reform.py tests/test_ops.py tests/test_agent_tools.py"

  # 4. Full DXF before the Present day
  - id: dxf-full-export
    status: draft
    template: feature
    budget_usd: 1.5
    goal: |
      Extend the DXF export so a Scene produces a complete DXF per the dxf-export skill: wall polygons with door/window
      openings cut and swing arcs, basic furniture footprints with labels (CONCEPT suffix when concept), area text per room,
      dimension entities from measured lengths, and a title block (A-ANNO-TEXT) with project name, units, scale, the
      "Preliminary: not a structural certification" label and one line per active professional-required flag. Wall status
      layers for reforms: A-WALL-EXST (existing), A-WALL-NEWW (new), A-WALL-DEMO (demolished, dashed) when a base Scene is
      given. Deterministic; export blocked when scale_confirmed is false. AIA layers and explicit $INSUNITS as in AGENTS.md.
      New code may go in new server/export/dxf_*.py modules. Do not touch server/export/takeoff.py.
    context: [AGENTS.md, .claude/skills/dxf-export/SKILL.md, .claude/skills/scene-model/SKILL.md, server/export/dxf.py, server/export/layers.py]
    scope: ["server/export/dxf.py", "server/export/layers.py", "server/export/dxf_*.py", "server/tests/test_dxf_full.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_dxf_full.py tests/test_dxf.py"

  # 5. Day 4 UI: chat sheet + push-to-talk (route and strings wired by day)
  - id: web-agent-chat
    status: draft
    template: feature
    budget_usd: 1.25
    goal: |
      Build web/src/agent/: ChatSheet (bottom sheet per the mobile-ui skill, phone-first) with the message list, tool events
      rendered as compact chips (op applied, rule violation, "needs a licensed professional" flag in a warning style), a text
      input, and PushToTalk (press-and-hold, MediaRecorder, returns a Blob through an onAudio prop; permission denied and
      unsupported states handled; no network). agentApi.ts exposes sendTurn(projectId, text, selected?) typed against a
      local TurnResponse type mirroring server/agent (no fetch to a route that doesn't exist yet: the base URL comes from the
      existing api config). UI strings go in web/src/agent/agent.i18n.ts (en + es-AR) for a later merge into the shared
      dictionary; do not edit web/src/i18n/*, App.tsx or package.json. Vitest + Testing Library tests for rendering, chips,
      push-to-talk states (MediaRecorder mocked) and sendTurn request shape.
    context: [AGENTS.md, .claude/skills/mobile-ui/SKILL.md, .claude/skills/reform-agent/SKILL.md, web/src/intake/api.ts, web/src/scene/store.ts]
    scope: ["web/src/agent/**"]
    verify: "cd web && npx vitest run src/agent && npx tsc --noEmit"

  # 6. Present: AR maquette export (Day 6)
  - id: web-ar-export
    status: draft
    template: feature
    budget_usd: 1.5
    goal: |
      Build web/src/ar/ per the ar-export skill: sceneToMaquette(scene, scale) builds a three.js Object3D from the Scene
      (reuse web/src/view3d/sceneToMeshes.ts, don't duplicate geometry; walls, openings, floor; concept items labelled),
      exportGlb(object) via three's GLTFExporter (three/examples/jsm) returning an ArrayBuffer, exportUsdz via USDZExporter,
      and MaquetteViewer that renders <model-viewer> with ar/ar-modes when the custom element is registered and otherwise
      shows a clear "AR viewer unavailable" fallback (do not add dependencies; note in .mission/PROGRESS.md if
      @google/model-viewer must be added). Units: 1 unit = 1 m at scale 1; table-top maquette scale parameter (default 1:50).
      Tests: object bounds match the Scene extents times scale, GLB export returns a non-empty buffer with the glTF magic,
      the fallback renders. Do not edit web/src/view3d/*, App.tsx, web/src/i18n/* or package.json.
    context: [AGENTS.md, .claude/skills/ar-export/SKILL.md, web/src/view3d/sceneToMeshes.ts, web/src/scene/types.ts]
    scope: ["web/src/ar/**"]
    verify: "cd web && npx vitest run src/ar && npx tsc --noEmit"

  # 7. Fidelity badges (Day 7)
  - id: web-fidelity-badges
    status: draft
    template: feature
    budget_usd: 0.75
    goal: |
      Build web/src/fidelity/: a pure summarizeFidelity(scene) returning per-wall provenance counts (measured_ar,
      measured_tape, written_on_sketch, estimated), whether any concept item exists, and the overall label (Measured when
      every wall is measured, otherwise Preliminary with the estimated walls listed); ProvenanceBadge for one wall;
      FidelitySummary card (Measured / Concept / Preliminary chips, estimated walls flagged as a warning). Phone-first per the
      mobile-ui skill. Strings in web/src/fidelity/fidelity.i18n.ts (en + es-AR); do not edit web/src/i18n/*, App.tsx or
      package.json. Vitest tests for the pure function (all measured, mixed, all estimated, concept present) and rendering.
    context: [AGENTS.md, .claude/skills/mobile-ui/SKILL.md, .claude/skills/scene-model/SKILL.md, web/src/scene/types.ts]
    scope: ["web/src/fidelity/**"]
    verify: "cd web && npx vitest run src/fidelity && npx tsc --noEmit"

  # 8. Deliver UI: staged takeoff view (Day 5)
  - id: web-takeoff-view
    status: draft
    template: feature
    budget_usd: 1.0
    goal: |
      Build web/src/deliver/: TakeoffView renders a staged construction takeoff (stages in order foundations, walls,
      bond_beams_roof, openings, finishes) from a typed Takeoff defined in web/src/deliver/takeoffTypes.ts (mirror the
      planned server pydantic model: stage -> lines of {material_id, name, quantity, unit, waste_factor, recipe_source,
      estimated}; flags; preliminary label). Quantities locale-aware (es-AR decimal comma), estimated lines marked, recipe
      source on tap, professional flags banner, "Preliminary: not a structural certification" footer, and a client-side CSV
      download built from the data. Never show prices. A fixture JSON in web/src/deliver/__fixtures__/. Strings in
      web/src/deliver/deliver.i18n.ts (en + es-AR); do not edit web/src/i18n/*, App.tsx or package.json. Vitest tests:
      stage order, locale formatting, estimated marking, CSV content.
    context: [AGENTS.md, .claude/skills/mobile-ui/SKILL.md, assets/catalog.json, docs/DECISIONS.md]
    scope: ["web/src/deliver/**"]
    verify: "cd web && npx vitest run src/deliver && npx tsc --noEmit"

  # 9. Present: deterministic top-view snapshot (input for the Muse Image render and the family link)
  - id: scene-snapshot
    status: draft
    template: feature
    budget_usd: 0.75
    goal: |
      Implement server/render/snapshot.py: a deterministic top-view SVG of a Scene (no model calls, no new dependencies):
      walls as filled polygons with openings cut, door swings, room names and areas (es-AR or en), furniture footprints,
      a scale bar in meters, north-agnostic, and a "Preliminary" corner label; fixed viewBox from the Scene bounds with a
      margin. Same Scene -> byte-identical SVG. Tests: determinism, every room label present, scale bar length matches
      meters, openings produce gaps, valid XML.
    context: [AGENTS.md, .claude/skills/scene-model/SKILL.md, .claude/skills/muse-render/SKILL.md, server/scene/models.py]
    scope: ["server/render/**", "server/tests/test_snapshot.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_snapshot.py"

  # 10. Variants A/B (P1; scoped so it can't block P0)
  - id: variants-model
    status: draft
    template: feature
    budget_usd: 1.0
    goal: |
      Implement variants as Scene branches (ADR-013) in server/scene/variants.py: Project with branches A/B/C,
      create_variant(from, label) forking at the current version, materialize(branch) = base + parent ops up to the fork
      + own ops (cached by version), undo within a branch, choose(label). A project with no extra variants behaves as a single
      proposal (the P0 default). Persist through server/db.py (SQLModel), keeping existing tables and functions working.
    context: [AGENTS.md, docs/DECISIONS.md, .claude/skills/scene-model/SKILL.md, server/scene/ops.py, server/db.py]
    scope: ["server/scene/variants.py", "server/db.py", "server/tests/test_variants.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_variants.py tests/test_api.py"

  # P1, only on a spare night (consumer polish, ADR-020; imagined materials are in CUTLIST)
  - id: imagined-materials
    status: skip
    template: single
    budget_usd: 1.5
    goal: |
      Implement the generate_material Design tool (P1): description -> Muse Image seamless texture via mme.client
      (tag "material", tier draft, cached by prompt hash), stored as a Scene material with concept=true, tiling 1x1 m.
      Tests in replay with a recorded fixture; the tool refuses without an explicit user request flag.
    context: [AGENTS.md, .claude/skills/reform-agent/SKILL.md, .claude/skills/meta-model-api/SKILL.md, server/agent/tools.py]
    scope: ["server/agent/materials.py", "server/tests/test_materials.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_materials.py"
