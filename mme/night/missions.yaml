# Maqet night missions (assisted self-build, ADR-022), aligned with mme/milestones.yaml and docs/PLAN.md. Each one moves the NEXT day's work forward.
# The evening before: refine the goal if needed, commit, `mme night prep` (answer the agent), `mme night run --until 07:30`.
# Total ≈ $14 of the $15 night pool; none exceeds the $4 per-night cap.
# Demo inputs (plans, hand-drawn sketches, site photo + `*.truth.json`) are regenerated on Day 1 under `samples/` (docs/PLAN.md).
defaults:
  harness: gateway
  base: main
  timeout_min: 120

missions:
  # Mon 26 night -> Tue (Capture: plan and sketch intake)
  - id: intake-cleanup
    status: draft
    template: feature
    budget_usd: 2.0
    goal: |
      Implement server/intake/cleanup.py: given proposed walls in normalized image coordinates (from a drawn plan OR a
      hand-drawn sketch, which is noisier: wobbly lines, corners not square), snap endpoints within a tolerance (default 2%,
      looser configurable value for sketches), merge near-collinear segments, close loops, polygonize rooms (shapely), attach
      labels to rooms, and convert to a Scene once a scale (px per meter) is given. Pure functions, no model calls. Tests
      cover a clean plan-like input and a noisy sketch-like input (synthetic perturbations of the same layout).
    context: [AGENTS.md, .claude/skills/scene-model/SKILL.md, .claude/skills/meta-ingest/SKILL.md, server/scene/models.py]
    scope: ["server/intake/cleanup.py", "server/tests/test_intake_cleanup.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_intake_cleanup.py"

  # Tue 27 night -> Wed (construction rules + catalog, ADR-023/024)
  - id: asset-catalog
    status: draft
    template: single
    budget_usd: 1.0
    goal: |
      Create assets/catalog.json as the construction-material catalog with recipes (ADR-024): ~12 construction materials
      (e.g. solid brick, hollow ceramic brick, mortar, cement bag, sand, gravel, steel bar by diameter, roofing sheet, door,
      window), each with id, name (es-AR) + name_en, kind, unit, recipe (quantity per m2 of wall, or per m3 or per piece, by
      brick type and wall thickness where relevant), waste_factor, recipe_source (citation or "estimate, to be reviewed by a
      master builder"), source URL and license (CC0 for any file asset), local path (list paths only, don't download files).
      Add a small basic furniture set (about 6 items: bed, table, chair, stove, wardrobe, door swing arc) with real
      dimensions, CC0 only (Kenney, Poly Pizza). Add server/tests/test_catalog.py asserting: every file asset is CC0 with a
      source, ids are unique, every material has unit + recipe + waste factor + recipe_source, recipe values are positive and
      sane, furniture dims are sane. No style presets (CUTLIST, ADR-022).
    context: [AGENTS.md, docs/DECISIONS.md, docs/PRODUCT.md, .claude/skills/scene-model/SKILL.md]
    scope: ["assets/catalog.json", "server/tests/test_catalog.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_catalog.py"

  # Wed 28 night -> Thu (Reform: agent tools)
  - id: agent-tools
    status: draft
    template: feature
    budget_usd: 2.5
    goal: |
      Implement server/agent/tools.py, executor.py and stages.py for the stage-scoped toolsets (ADR-014, ADR-022). Reform
      (main stage): add_room, add_wall, remove_wall, add_opening, move_opening, undo. Design (light): list_catalog,
      place_furniture, move_item, rotate_item, remove_item, undo. Present: create_variant, render_view (stubs that return a
      structured result; no model calls). Per the reform-agent skill: pydantic inputs, semantic anchors resolved
      deterministically, every tool calling a pure op in server/scene/ops.py and validated by server/scene/rules.py, structured
      errors for rule violations, and professional-required flags (second floor, load-bearing wall removal, span over the
      limit, unknown soil) returned in the tool result. A tool outside the current stage gets a structured refusal. Ops that
      do not exist yet in ops.py are reported in the result, not invented here. No model calls: tests call the executor directly.
    context: [AGENTS.md, .claude/skills/reform-agent/SKILL.md, .claude/skills/scene-model/SKILL.md, server/scene/ops.py, server/scene/rules.py]
    scope: ["server/agent/tools.py", "server/agent/executor.py", "server/agent/stages.py", "server/tests/test_agent_tools.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_agent_tools.py"

  # Thu 29 night -> Fri (variants; P1 for the demo, PLAN Day 7 "variantes A/B si hay tiempo"). Set status: skip if Day 4 is behind.
  - id: variants-model
    status: draft
    template: feature
    budget_usd: 2.0
    goal: |
      Implement variants as Scene branches (ADR-013) in server/scene/variants.py: Project with branches A/B/C,
      create_variant(from, label) forking at the current version, materialize(branch) = base + parent ops up to the fork
      + own ops (cached by version), undo within a branch, choose(label). A project with no extra variants behaves as a single
      proposal (the P0 default). Persist through server/db.py (SQLModel).
    context: [AGENTS.md, docs/DECISIONS.md, .claude/skills/scene-model/SKILL.md, server/scene/ops.py, server/db.py]
    scope: ["server/scene/variants.py", "server/db.py", "server/tests/test_variants.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_variants.py"

  # Fri 30 night -> Sat (full DXF ready before the Present day)
  - id: dxf-full-export
    status: draft
    template: feature
    budget_usd: 2.5
    goal: |
      Extend server/export/ so a Scene (chosen variant) produces a complete DXF per the dxf-export skill: wall polygons
      with door/window openings cut and swing arcs, basic furniture footprints with labels (CONCEPT suffix when concept),
      area text per room, dimension entities from measured lengths, and a title block (A-ANNO-TEXT) with project name, units,
      scale, the "Preliminary: not a structural certification" label and one line per active professional-required flag.
      Deterministic; export blocked when scale_confirmed is false. AIA layers and explicit units as in AGENTS.md.
    context: [AGENTS.md, .claude/skills/dxf-export/SKILL.md, .claude/skills/scene-model/SKILL.md, server/export/dxf.py]
    scope: ["server/export/**", "server/tests/test_dxf_full.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_dxf_full.py tests/test_dxf.py"

  # Sat 31 night -> Sun (Reform hardening)
  - id: reform-ops
    status: draft
    template: feature
    budget_usd: 2.5
    goal: |
      Harden the Reform ops in server/scene/ops.py (add_room, add_wall, remove_wall, add_opening, move_opening): re-polygonize
      and recompute rooms after every op, keep surface/furniture assignments where the room survives, re-validate furniture
      (move it out of the way or report a conflict), keep undo exact, flag removal of a load-bearing wall as
      professional-required, and run rules.py construction rules on every result. Add property tests: 30 random Reform op
      sequences on the demo scenes never crash, never leave a Scene that violates the geometry rules, and undo back to the
      start restores the original Scene exactly.
    context: [AGENTS.md, .claude/skills/scene-model/SKILL.md, .claude/skills/reform-agent/SKILL.md, server/scene/ops.py, server/scene/rules.py, server/agent/tools.py]
    scope: ["server/scene/ops.py", "server/scene/rooms.py", "server/agent/tools.py", "server/tests/test_reform.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_reform.py tests/test_ops.py"

  # Sun 1 night -> Mon freeze (P0 differentiator: staged takeoff, ADR-021 + ADR-024)
  - id: quantities-takeoff
    status: draft
    template: feature
    budget_usd: 2.0
    goal: |
      Refine server/export/takeoff.py into the staged construction takeoff (ADR-021, ADR-024). Deterministic, no model calls,
      no prices. From the chosen variant vs the captured base and the per-material recipes in assets/catalog.json, compute
      quantities by stage in this order: foundations, walls, bond_beams_roof, openings, finishes (e.g. bricks per m2 of wall by
      brick type and thickness, mortar, cement bags, sand and gravel in m3, steel bars for bond beams, roofing sheets, doors
      and windows; floor/wall finish m2 net of openings; metres demolished and built). Apply each recipe's waste factor and
      carry its source. Return a pydantic Takeoff (JSON) with the active professional-required flags and a "preliminary"
      label, plus a CSV export, and add GET /projects/{id}/takeoff (+ .csv, optional variant parameter) in server/api.py.
      Tests use the demo inputs' *.truth.json under samples/ with hand-computed expected values per stage.
    context: [AGENTS.md, docs/DECISIONS.md, .claude/skills/scene-model/SKILL.md, assets/catalog.json, server/scene/models.py, server/scene/rules.py, server/api.py]
    scope: ["server/export/takeoff.py", "server/api.py", "server/tests/test_takeoff.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_takeoff.py"

  # P1, only on a spare night (consumer polish, ADR-020; imagined materials are in CUTLIST): keep as skip unless everything is green
  - id: imagined-materials
    status: skip
    template: single
    budget_usd: 1.5
    goal: |
      Implement the generate_material Design tool (P1): description -> Muse Image seamless texture via mme.client
      (tag "material", tier draft, cached by prompt hash), stored as a Scene material with concept=true, tiling 1x1 m.
      Tests in replay with a recorded fixture; the tool refuses without an explicit user request flag.
    context: [AGENTS.md, .claude/skills/reform-agent/SKILL.md, .claude/skills/meta-model-api/SKILL.md, server/agent/tools.py]
    scope: ["server/agent/tools.py", "server/render/textures.py", "server/tests/test_generate_material.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_generate_material.py"
