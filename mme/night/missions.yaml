# Maqet night missions (assisted self-build, ADR-022), aligned with mme/milestones.yaml and docs/PLAN.md. Each one moves the NEXT day's work forward.
# The evening before: refine the goal if needed, commit, `mme night prep` (answer the agent), `mme night run --until 07:30`.
# Missions run one after another, each in its own worktree from `main`, so they must NOT share files: scopes below are
# disjoint. Shared files are wired by day the next morning: server/api.py, web/src/i18n/*, package.json, requirements.txt.
# Real spend is ~$0.10 per mission on Spark contributor; budgets are kill caps, not estimates.
# Demo inputs (plans, hand-drawn sketches, site photo + `*.truth.json`) live under `samples/plans/`.
defaults:
  harness: gateway
  base: main
  timeout_min: 120
  link: [web/node_modules]

missions:
  # ---------------------------------------------------------------- done (merged into main)
  - id: intake-cleanup
    status: skip
    template: feature
    budget_usd: 2.0
    goal: |
      Done: server/intake/cleanup.py (merged).
    scope: ["server/intake/cleanup.py", "server/tests/test_intake_cleanup.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_intake_cleanup.py"

  - id: asset-catalog
    status: skip
    template: single
    budget_usd: 1.0
    goal: |
      Done: assets/catalog.json + server/tests/test_catalog.py (merged 2026-10-28, brick yields corrected).
    scope: ["assets/catalog.json", "server/tests/test_catalog.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_catalog.py"

  - id: agent-tools
    status: skip
    template: feature
    budget_usd: 2.5
    goal: |
      Done: server/agent/tools.py, executor.py, stages.py (merged 2026-10-28).
    scope: ["server/agent/tools.py", "server/agent/executor.py", "server/agent/stages.py", "server/tests/test_agent_tools.py"]
    verify: "cd server && MME_MODE=replay python -m pytest -q tests/test_agent_tools.py"

  # ---------------------------------------------------------------- Wed 28 night: 11 missions, disjoint scopes
  # 0. Mode A capture v2 (runs first: primary demo path). Phone test 28 Oct showed the v1 flow is unusable.
  - id: ar-capture-v2
    status: skip  # split 29 Oct into ar-capture-walls + ar-capture-openings (night build stalled)
    template: feature
    budget_usd: 2.0
    timeout_min: 150
    goal: |
      Rework Mode A AR capture (web/src/measure) into a predictable room-capture flow. Nobody can phone-test tonight, so
      every behavior must live in pure, unit-tested code; the React component only wires XR hits and taps to it.
      Target flow (decided with the user; ONE room per session, multi-room is out of scope):
      W1 Wall 1: tap the floor at the base of the wall (corner A), tap the floor at the other end (corner B) -> length;
         then raise the camera and tap where the wall meets the ceiling -> that wall's real height (hit y - floorY,
         2.0-4.0 m is the plausible range; outside it the value is KEPT and flagged
         "check this" in the pill, never discarded; see F7). Wall 1 is now mapped with length + height.
      W2 Each next wall chains from the previous end corner: one base tap (next corner) + one ceiling tap. A base tap
         within 0.25 m of corner A closes the room (still followed by that wall's ceiling tap). Each wall stores its own
         measured height (provenance measured_ar); there is no separate Height mode.
      W3 Only after the room is closed (or the user taps "Finish walls") do Door and Window unlock; openings attach to
         the mapped walls. Undo steps back one tap at a time (ceiling tap, then base tap) across the whole sequence.
      Phone-test findings (Android, 28 Oct) to fix:
      F1 Floating corners: wall-mode corners keep the y of whatever surface the hit-test touched (often a wall), and the
         floor datum is just the first tap's y, so the traced room is a 3D tangle. Fix: the floor datum comes only from a
         horizontal-plane hit (hit normal mostly +Y; check what xrAdapter exposes, add the pose orientation if missing),
         and every wall corner is projected onto y = floorY. A wall-mode tap on a vertical surface before the floor is
         known shows "Point at the floor first" instead of adding a corner.
      F2 Leftover geometry: retries pile up; Undo and Cancel leave earlier walls on screen. One AR session captures one
         room: Undo removes the last corner (and the wall it closed), "Start over" (confirm step) clears the session
         geometry; Cancel exits without writing anything to the Scene. Remove the "Use this measure" button unless it has
         a clear job; if it stays, document the job in the code.
      F3 Context lost on mode switch: switching to Height/Door/Window erases the traced lines. The overlay must always draw
         every traced wall as a floor line plus a translucent vertical quad from floorY to that wall's measured height (the
         rubber-band quad follows the reticle while the ceiling tap is pending), in every mode; in Door/Window mode the wall under the reticle is highlighted.
      F4 Doors/windows can't be marked: the user tapped top-left then bottom (a vertical line) and got 0.14 m width; the
         "left edge / right edge" copy is ambiguous. New flow: two diagonal corners of the opening on the wall surface
         (bottom-left, then top-right, either order accepted). Both taps project onto the highlighted wall's plane; width
         and offset along the wall from the horizontal component, height from the vertical span, sill = lower tap y -
         floorY (doors: sill null, and a door's bottom snaps to the floor). A live rectangle preview follows the reticle
         after the first tap. Only geometric impossibilities (opening outside the wall,
         zero width) reject the tap and keep the first corner; rule issues (door < 0.80 m, height > the wall's height)
         are KEPT and flagged "check this", never discarded. Placed openings render as rectangles on their wall in the overlay.
      F5 Openings in 3D: web/src/view3d/sceneToMeshes.ts subtracts the full wall height for an opening; render the lintel
         above it and, for windows, the wall below the sill, so doors and windows read correctly in the 3D view.
      F6 HUD: the step pill always says the next tap ("Tap the base of the wall", "Tap the other end", "Tap where the
         wall meets the ceiling", "Wall 2: tap the next corner"...); the selector is one row (Walls | Door | Window, the
         last two disabled until W3); actions are Undo / Start over / Done; nothing opaque covers the middle.
      F7 Editable measurements (the camera can measure wrong): after Done, a review sheet lists every wall (length,
         height) and opening (width, height, sill) with the flagged ones on top. Each value is a numeric input in meters;
         an edit dispatches the existing store ops (setWallLength with provenance measured_tape, setWallHeight; an
         opening edit is removeOpening + markOpening with the same id) and flips the wall's provenance badge. Nothing
         captured is ever silently dropped. The review sheet is reachable again later from the measure screen.
      Architecture: extract the capture state machine from ArMeasure.tsx (994 lines) into a pure reducer
      web/src/measure/captureSession.ts: captureReducer(state, event) -> state, with events such as floorHit, baseTap,
      ceilingTap, finishWalls, modeChange, openingTap, undo, startOver, done, and a toSceneOps(state) projection that produces the SceneOps for Done. Keep
      cornerMath.ts and openingMath.ts as the geometry layer (one implementation each, no duplicates in the component).
      Tests (vitest, RED first): F1-F5 and F7 each get reducer- or math-level tests (F7: a flagged value survives to toSceneOps; an edit emits the right ops), including a full scripted session (4 walls
      as base, base+ceiling, ..., closing on corner A with different heights per wall, then one door, one window, Done) asserting the exact Scene ops; plus
      sceneToMeshes tests for lintel and sill segments. Strings: new en/es-AR copy goes in web/src/measure/measure.i18n.ts
      (wired into web/src/i18n by day); do not edit web/src/i18n/*. Append any assumption or shortcut to
      .mission/PROGRESS.md under "HARDENING candidates".
    context: [AGENTS.md, .claude/skills/meta-ingest/SKILL.md, .claude/skills/mobile-ui/SKILL.md, .claude/skills/scene-model/SKILL.md, web/src/measure/ArMeasure.tsx, web/src/measure/cornerMath.ts, web/src/measure/openingMath.ts, web/src/measure/ArOverlay.tsx, web/src/measure/xrAdapter.ts, web/src/view3d/sceneToMeshes.ts, web/src/scene/types.ts]
    scope: ["web/src/measure/**", "web/src/view3d/**", "web/src/styles.css", "web/src/scene/store.ts", "web/src/scene/store.test.ts"]
    verify: "cd web && npx vitest run src/measure src/view3d && npx tsc --noEmit"

