# Maqet milestones (product v2, assisted self-build: docs/PRODUCT.md, ADR-022; day-by-day plan in docs/PLAN.md). Each gate is the definition of done for that day.
# `mme gate` runs today + anything late. `mme today` shows countdown, behind, and what to cut.
# Demo inputs (plan, hand-drawn sketch, site photo) + `*.truth.json` are regenerated on Day 1 under `samples/` (docs/PLAN.md).
# The gates below only assume `samples/**/*.truth.json`, with hand-drawn sketches named `*sketch*` or `*croquis*`.
# Re-planned 2026-10-26 for ADR-025 (three capture modes, per-wall measurements). Lesson: day-1/2 gates tested pieces, not integration.
# RULE: every day has at least one gate marked "integration:" (a route + an API test end to end, App renders the stage screen,
# or upload -> Scene). App stage tests live in web/src/App.test.tsx; their names start with "stage <name>" so `-t` selects them.
deadline: "2026-11-04T21:00:00-05:00"
internal_deadline: "2026-11-04T18:00:00-03:00"
freeze: "2026-11-02"
test_cmd: "cd server && MME_MODE=replay python -m pytest -q && cd ../web && npm test -- --run"

milestones:
  - day: "2026-10-26"
    goal: "Walking skeleton: Scene schema + ops + undo, FastAPI, PWA shell (full-screen 3D + bottom sheet + stage chips, es-AR/en dictionary), DXF walls; demo inputs regenerated incl. >=1 hand-drawn sketch with ground truth"
    gates:
      - { name: "scene + ops + dxf tests", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_scene.py tests/test_ops.py tests/test_dxf.py" }
      - { name: "TS types generated + web builds", run: "cd web && npm run gen:types && npm run build" }
      - { name: "i18n dictionary has es-AR and en", run: "grep -rqE 'es-AR|es_AR' web/src/i18n && grep -rqE '(^|[^A-Za-z])en([^A-Za-z]|$)' web/src/i18n" }
      - { name: "demo inputs with ground truth (>=3, >=1 hand sketch)", run: "test $(find samples -name '*.truth.json' | wc -l) -ge 3 && find samples -iname '*sketch*.truth.json' -o -iname '*croquis*.truth.json' | grep -q ." }
    cut_if_late: ["mm export (meters only)", "PWA install prompt", "English strings (es-AR only until Day 7)"]

  - day: "2026-10-27"
    goal: "Capture, INTEGRATED: POST /intake (image + kind) -> read_plan (replay) -> cleanup -> Scene draft; web dev script, IntakeScreen mounted in Capture, web calls the API via VITE_API_URL. Then per-wall measurements (provenance) + mode B (photo + tap measurements) + mode C (sketch, per-wall solver) + a non-proportional sketch fixture with ground truth"
    gates:
      - { name: "intake tests in replay (plan + sketch)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_intake.py tests/test_intake_cleanup.py && grep -qi sketch tests/test_intake.py" }
      - { name: "corner editor tests", run: "cd web && npm test -- --run src/intake" }
      - { name: "integration: POST /intake end to end in replay (image -> Scene draft)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api_intake.py" }
      - { name: "integration: web flow upload -> Scene through the API client, and App mounts Capture", run: "cd web && npm test -- --run src/intake/flow && npm test -- --run src/App -t 'stage capture'" }
      - { name: "web dev script and API URL wired", run: "grep -q 'vite --host' web/package.json && grep -rq VITE_API_URL web/src" }
      - { name: "per-wall measurements: provenance, mode B, mode C solver", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_measure.py tests/test_solver.py" }
      - { name: "non-proportional sketch fixture with truth; per-wall solver beats a global scale", run: "find samples -iname '*nonproportional*.truth.json' | grep -q . && cd server && MME_MODE=replay python -m pytest -q tests/test_solver.py -k nonproportional" }
    cut_if_late: ["perspective correction (assume a flat shot)", "mode B opening taps (keep wall lengths)", "solver contradiction handling (warnings only, no guided resolution)"]

  - day: "2026-10-28"
    goal: "Mode A, AR measure (WebXR, Android Chrome), primary demo path. FIRST: verify the phone supports WebXR AR (Chrome + Google Play Services for AR) with the official immersive-web hit-test sample, and serve the dev web over HTTPS (@vitejs/plugin-basic-ssl + vite --host, self-signed cert accepted on the phone, or a tunnel; http://192.168.x.x does NOT work). Then corner taps -> meters -> walls with measured_ar, ceiling height, support detection with fallback to B/C. Plus 3D view from the Scene + rules/flags (already built) + catalog with recipes (from the night)"
    gates:
      - { name: "scene->mesh tests", run: "cd web && npm test -- --run src/view3d" }
      - { name: "construction rules + professional flags tested", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_rules.py && grep -qi professional scene/rules.py" }
      - { name: "catalog valid (CC0 + source, recipes, budgets)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_catalog.py" }
      - { name: "mode A: support detection + fallback, taps -> walls with measured_ar", run: "cd web && npm test -- --run src/measure" }
      - { name: "integration: measured points -> Scene through the API (provenance measured_ar)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api_measure.py" }
      - { name: "integration: HTTPS dev serving configured (WebXR needs a secure context)", run: "grep -q 'plugin-basic-ssl' web/package.json && grep -q 'basicSsl' web/vite.config.ts" }
      - { name: "integration: App renders the 3D view of the intake Scene", run: "cd web && npm test -- --run src/App -t 'stage 3d'" }
    cut_if_late: ["mode A (if WebXR fails on the device, the demo falls back to mode B, then C; hide the AR measure button)", "ceiling rendering", "material thumbnails (use names)", "ventilation/light rule (keep area, height, door, span rules and the 4 flags)"]

  - day: "2026-10-29"
    goal: "Reform: agent v1 in Spanish with stage-scoped tools (add room/wall/opening, remove wall), rules + professional flags in tool results, tap selection as context, chat sheet + push-to-talk"
    gates:
      - { name: "agent tool tests", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_agent_tools.py" }
      - { name: "agent evals (ES + EN, replay)", run: "cd server && MME_MODE=replay python -m pytest -q tests/agent_evals" }
      - { name: "voice transcribe in replay", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_voice.py" }
      - { name: "integration: POST /agent/turn applies validated ops to a Scene in replay", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api_agent.py" }
      - { name: "integration: App renders the chat sheet and applies an agent reply to the Scene", run: "cd web && npm test -- --run src/App -t 'stage reform'" }
    cut_if_late: ["move_opening (add/remove only)", "transcript editing before sending", "rotate_item (place with a default facing)"]

  - day: "2026-10-30"
    goal: "Deliver (1): staged takeoff from catalog recipes (JSON + CSV; quantities from estimated walls labelled), DXF with openings and preliminary/flag notes, saved projects + read-only family link; first full-flow test (sketch -> Scene -> reform -> takeoff -> DXF)"
    gates:
      - { name: "takeoff by stage with recipes", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_takeoff.py" }
      - { name: "API: projects, read-only share token", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api.py" }
      - { name: "dxf tests", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_dxf.py" }
      - { name: "web builds", run: "cd web && npm run build" }
      - { name: "integration: takeoff route labels estimated quantities", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api_takeoff.py" }
      - { name: "integration: full flow in replay (sketch -> Scene -> reform -> takeoff -> DXF)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }
      - { name: "integration: App renders the Deliver screen from the Scene", run: "cd web && npm test -- --run src/App -t 'stage deliver'" }
    cut_if_late: ["takeoff CSV (keep JSON + in-app table)", "variants (single proposal)", "family comments"]

  - day: "2026-10-31"
    goal: "Present: AR maquette (GLB/USDZ + model-viewer) on iPhone and Android + Muse Image render of the finished room + light Design (bed fits, door swing) + full DXF (from the night)"
    gates:
      - { name: "GLB under phone budget for the samples", run: "cd web && npm test -- --run src/ar" }
      - { name: "render pipeline in replay", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_render.py" }
      - { name: "full DXF tests", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_dxf_full.py" }
      - { name: "integration: render route in replay returns the finished-room image", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_api_render.py" }
      - { name: "integration: App renders the Present stage (AR button gated by support)", run: "cd web && npm test -- --run src/App -t 'stage present'" }
    cut_if_late: ["light Design furniture checks (basic furniture only)", "render per edit (one render of the final proposal)", "camera presets beyond 2"]

  - day: "2026-11-01"
    goal: "Fidelity badges (Measured / Concept / Preliminary + per-wall provenance, estimated flagged) + Reform hardening (from the night) + P1: SAM 3.1 opening widths from measured wall photos; if green: typed prices, variants A/B"
    gates:
      - { name: "reform ops + agent Reform stage in replay", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_reform.py" }
      - { name: "rules + takeoff tests", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_rules.py tests/test_takeoff.py" }
      - { name: "preliminary label in UI strings and DXF export", run: "grep -rqi 'preliminar' web/src/i18n && grep -rqi 'preliminary' server/export" }
      - { name: "integration: SAM openings on a measured wall photo in replay (API route)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_openings_sam.py" }
      - { name: "integration: App shows per-wall provenance and the Measured badge", run: "cd web && npm test -- --run src/App -t 'provenance'" }
      - { name: "integration: full flow still green", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }
    cut_if_late: ["typed unit prices", "variants A/B/C (single proposal)", "SAM 3.1 openings (manual openings only)", "move_opening (add/remove only)"]

  - day: "2026-11-02"
    goal: "FEATURE FREEZE. Staged takeoff refined (from the night) + Rosa demo recorded (standard tier) into samples/replay; polish on both phones"
    gates:
      - { name: "takeoff matches hand-computed values", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_takeoff.py" }
      - { name: "whole suite green", run: "cd server && MME_MODE=replay python -m pytest -q && cd ../web && npm test -- --run" }
      - { name: "replay cache recorded", run: "test $(find samples/replay -type f ! -name .gitkeep | wc -l) -gt 0" }
      - { name: "integration: full flow in replay (demo path, upload -> DXF)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }
    cut_if_late: ["takeoff CSV (keep the in-app table)", "anything not on the demo path"]

  - day: "2026-11-03"
    goal: "Deploy (front + back), README (with limitations), 3-minute video in Spanish with English subtitles"
    gates:
      - { name: "README has demo link + Meta models + preliminary disclaimer", run: "grep -qiE 'youtu|loom|vimeo|drive.google' README.md && grep -qi muse README.md && grep -qiE 'preliminary|not a structural' README.md" }
      - { name: "integration: release build serves the app and the full flow passes in replay", run: "cd web && npm run build && cd ../server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }
    cut_if_late: ["custom domain", "back deploy (submit with replay-mode front + video)"]

  - day: "2026-11-04"
    goal: "Buffer. Submit by 18:00 ART"
    gates:
      - { name: "ship checklist", run: "mme ship" }
      - { name: "integration: full flow in replay on the final commit", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }

ship:
  readme: README.md
  replay_dir: samples/replay
  deploy_url: ""
  demo_url_pattern: "youtu|loom|vimeo|drive\\.google"
  extra:
    - { name: "demo inputs with ground truth (>=3, incl. a hand sketch)", run: "test $(find samples -name '*.truth.json' | wc -l) -ge 3 && find samples -iname '*sketch*.truth.json' -o -iname '*croquis*.truth.json' | grep -q ." }
    - { name: "asset licenses declared (CC0 + source)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_catalog.py" }
    - { name: "construction rules + professional flags tested", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_rules.py" }
    - { name: "es-AR dictionary present", run: "grep -rqE 'es-AR|es_AR' web/src/i18n" }
    - { name: "per-wall solver tested on a non-proportional sketch", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_solver.py" }
    - { name: "full flow in replay (upload -> DXF)", run: "cd server && MME_MODE=replay python -m pytest -q tests/test_e2e_flow.py" }
