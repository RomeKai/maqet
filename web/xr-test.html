<!doctype html>
<!-- DEV-ONLY diagnostic page. Not part of the app build (vite only bundles index.html).
     Ports three.js webxr_ar_hittest to isolate "three renders nothing in AR" on the test phone.
     Usage: https://<laptop-ip>:5173/xr-test.html?v=0.186.1  (vite dev, --host, basicSsl) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xr-test (dev only)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        font: 12px/1.5 monospace; color: #0f0; background: rgba(0,0,0,.65);
        padding: 8px; white-space: pre-wrap; pointer-events: none;
      }
      #enter {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 11;
        font: 16px system-ui; padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <div id="hud">boot…</div>
    <script>
      // Classic script: resolve ?v= BEFORE any module loads, then inject the import map.
      var ALLOWED = ["0.186.1", "0.175.0", "0.165.0", "0.155.0", "0.150.0"];
      var v = new URLSearchParams(location.search).get("v") || "0.186.1";
      if (ALLOWED.indexOf(v) === -1) v = "0.186.1";
      window.__XR_TEST_V = v;
      var map = document.createElement("script");
      map.type = "importmap";
      map.textContent = JSON.stringify({
        imports: {
          three: "https://cdn.jsdelivr.net/npm/three@" + v + "/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@" + v + "/examples/jsm/",
        },
      });
      document.head.appendChild(map);
    </script>
    <script type="module">
      import * as THREE from "three";
      import { ARButton } from "three/addons/webxr/ARButton.js";

      const hud = document.getElementById("hud");
      const lines = { v: "requested three: " + window.__XR_TEST_V + " / loaded REVISION: " + THREE.REVISION };
      const draw = () => {
        hud.textContent = Object.values(lines).join("\n");
      };
      draw();

      lines.xr = "navigator.xr: " + (!!navigator.xr);
      draw();
      if (navigator.xr) {
        navigator.xr.isSessionSupported("immersive-ar").then((ok) => {
          lines.support = "immersive-ar supported: " + ok;
          draw();
        });
      }

      let camera, scene, renderer, reticle, hitTestSource = null, hitTestSourceRequested = false;
      let frames = 0, lastHit = "none";

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(innerWidth, innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] }));

      const controller = renderer.xr.getController(0);
      controller.addEventListener("select", () => {
        if (reticle.visible) {
          const mesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.1, 0.2, 32).translate(0, 0.1, 0),
            new THREE.MeshPhongMaterial({ color: 0xffffff * Math.random() })
          );
          mesh.position.setFromMatrixPosition(reticle.matrix);
          mesh.quaternion.setFromRotationMatrix(reticle.matrix);
          scene.add(mesh);
        }
      });
      scene.add(controller);

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial()
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      renderer.xr.addEventListener("sessionstart", () => {
        const session = renderer.xr.getSession();
        const rs = session.renderState;
        const layerCount = rs.layers ? rs.layers.length : 0;
        lines.session = "session: live | baseLayer: " + (!!rs.baseLayer) + " | layers: " + layerCount;
        draw();
      });
      renderer.xr.addEventListener("sessionend", () => {
        lines.session = "session: ended";
        draw();
      });

      renderer.setAnimationLoop((timestamp, frame) => {
        frames++;
        if (frame) {
          const referenceSpace = renderer.xr.getReferenceSpace();
          const session = renderer.xr.getSession();
          if (!hitTestSourceRequested) {
            session.requestReferenceSpace("viewer").then((viewerSpace) => {
              session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                hitTestSource = source;
              });
            });
            hitTestSourceRequested = true;
          }
          if (hitTestSource) {
            const results = frame.getHitTestResults(hitTestSource);
            if (results.length) {
              const hit = results[0];
              reticle.visible = true;
              reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
              lastHit = "hit";
            } else {
              reticle.visible = false;
              lastHit = "no-hit";
            }
          }
        }
        if (frames % 30 === 0) {
          lines.loop = "frames: " + frames + " | reticle: " + (reticle.visible ? "VISIBLE" : "hidden") + " | hit: " + lastHit;
          draw();
        }
        renderer.render(scene, camera);
      });

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
